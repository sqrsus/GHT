name: release

# 只有打 v* 标签时才发布（例：git tag v1.3.1 && git push origin v1.3.1）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 发布 (Windows / .NET 8)
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 放在最前面：标签与版本不一致时，不该先花几分钟编译再失败
      - name: 校验标签与程序集版本一致
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $version = ([xml](Get-Content 'src/GHT/GHT.csproj' -Raw)).Project.PropertyGroup.Version |
            Where-Object { $_ } | Select-Object -First 1

          Write-Host "tag = $tag / csproj Version = $version"

          if ($tag -ne $version) {
            throw "标签 ${{ github.ref_name }} 与 csproj Version=$version 不一致：请先改版本号再打标签"
          }

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 还原依赖
        run: dotnet restore GHT.sln

      - name: 依赖漏洞扫描
        shell: pwsh
        run: |
          $output = dotnet list GHT.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output

          if ($output -match 'has the following vulnerable packages') {
            throw '存在已知漏洞的直接或传递依赖，拒绝发布'
          }

      - name: 编译（Release）
        run: dotnet build GHT.sln -c Release --no-restore

      # 发布前必须绿：release 分支的产物不允许跳过测试
      - name: 运行单元与集成测试
        shell: pwsh
        run: |
          dotnet test tests/GHT.Tests/GHT.Tests.csproj -c Release --no-build `
            --logger "console;verbosity=normal" `
            --logger "trx;LogFileName=tests.trx" `
            --results-directory TestResults

          $code = $LASTEXITCODE
          if ($code -eq 0) { exit 0 }

          # 失败时把失败的用例名与断言首行写成 annotation（日志需要仓库权限才能下载）
          $trx = Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $trx) {
            Write-Host '::error::测试失败且没有产出 TRX，请查看完整日志'
            exit $code
          }

          [xml]$doc = Get-Content $trx.FullName -Raw
          $failed = @($doc.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' })

          if ($failed.Count -eq 0) {
            Write-Host '::error::测试失败但 TRX 里没有失败用例（可能是测试宿主崩溃）'
            exit $code
          }

          foreach ($item in $failed) {
            $message = ''
            try {
              $message = @($item.Output.ErrorInfo.Message -split "`r?`n" | Where-Object { $_.Trim() })[0]
            }
            catch {
              # 没有 ErrorInfo 时用例名本身已足够定位
            }

            Write-Host "::error title=失败用例::$($item.testName) | $message"
          }

          exit $code

      - name: 保留测试结果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 7

      - name: 发布单文件 exe（框架依赖）
        # 注意：EnableCompressionInSingleFile 仅在 self-contained 下可用（NETSDK1176），
        # 因此这里用 --self-contained false 时必须去掉压缩项。
        run: >
          dotnet publish src/GHT/GHT.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o dist

      - name: 校验产物与版本资源
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/GHT.exe')) {
            throw '发布产物中缺少 GHT.exe'
          }

          $version = ([xml](Get-Content 'src/GHT/GHT.csproj' -Raw)).Project.PropertyGroup.Version |
            Where-Object { $_ } | Select-Object -First 1

          $info = (Get-Item 'dist/GHT.exe').VersionInfo
          if (-not $info.FileVersion.StartsWith($version)) {
            throw "产物 FileVersion=$($info.FileVersion) 与 csproj Version=$version 不一致"
          }

          Get-ChildItem dist | Format-Table Name, Length

      - name: 生成 SHA256 清单
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist/GHT.exe' -Algorithm SHA256).Hash
          "SHA256 (GHT.exe) = $hash" | Tee-Object -FilePath 'dist/SHA256SUMS.txt'

          # 说明哈希的用途：用户下载后可自行校验，无需信任下载渠道的完整性
          ''
          'Verify: certutil -hashfile GHT.exe SHA256' | Tee-Object -FilePath 'dist/SHA256SUMS.txt' -Append

      - name: 打包 zip
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/GHT.exe')) {
            throw '发布产物中缺少 GHT.exe'
          }
          Compress-Archive -Path 'dist/*' -DestinationPath "GHT-${{ github.ref_name }}-win-x64.zip" -Force

      - name: 创建 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 产物未做代码签名（仓库里没有可用的签名证书）：因此同时附上 SHA256 清单，
          # 让用户能独立校验下载到的文件与构建产物一致。要启用签名，需在仓库 secrets
          # 中配置证书并用 signtool 在发布前签名，未配置前不做「假签名」。
          #
          # 正文优先用版本自带的说明文件：自动生成的 notes 只有提交标题，
          # 讲不清「默认值变了、老配置不会跟着变」这类用户真正需要知道的事。
          $notes = "docs/release-notes/${{ github.ref_name }}.md"
          $assets = @("GHT-${{ github.ref_name }}-win-x64.zip", "dist/SHA256SUMS.txt")

          if (Test-Path $notes) {
            Write-Host "使用版本说明：$notes"
            gh release create "${{ github.ref_name }}" @assets `
              --title "GHT ${{ github.ref_name }}" `
              --notes-file $notes
          }
          else {
            Write-Host '未找到版本说明文件，改用自动生成的 notes'
            gh release create "${{ github.ref_name }}" @assets `
              --title "GHT ${{ github.ref_name }}" `
              --generate-notes
          }
