name: build

# 触发时机：主干推送、PR、手动
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 编译 (Windows / .NET 8)
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 显示 SDK 信息
        run: dotnet --info

      - name: 还原依赖
        run: dotnet restore GHT.sln

      - name: 编译（Release）
        run: dotnet build GHT.sln -c Release --no-restore

      - name: 发布单文件 exe（框架依赖）
        run: >
          dotnet publish src/GHT/GHT.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o dist

      - name: 校验产物
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/GHT.exe')) {
            throw '发布产物中缺少 GHT.exe'
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: GHT-win-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
