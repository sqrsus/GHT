name: build

# 触发时机：主干推送、PR、手动
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      self_contained:
        description: '发布为独立部署（体积更大，但用户无需预装 .NET 桌面运行时）'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 编译 (Windows / .NET 8)
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 显示 SDK 信息
        run: dotnet --info

      - name: 还原依赖
        run: dotnet restore GHT.sln

      # 依赖漏洞扫描：只对「已知公告」负责，不替代人工审计。
      # dotnet list package --vulnerable 即使发现问题也返回 0，所以必须看输出而不是退出码。
      - name: 依赖漏洞扫描
        shell: pwsh
        run: |
          $output = dotnet list GHT.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output

          if ($output -match 'has the following vulnerable packages') {
            throw '存在已知漏洞的直接或传递依赖，见上方列表'
          }

          if ($output -match '\berror\b') {
            Write-Host '::warning::漏洞扫描未能正常完成，请检查网络或 NuGet 源'
          }

      - name: 编译（Release）
        run: dotnet build GHT.sln -c Release --no-restore

      - name: 运行单元与集成测试
        shell: pwsh
        run: |
          dotnet test tests/GHT.Tests/GHT.Tests.csproj -c Release --no-build `
            --logger "console;verbosity=normal" `
            --logger "trx;LogFileName=tests.trx" `
            --results-directory TestResults

          $code = $LASTEXITCODE
          if ($code -eq 0) { exit 0 }

          # 失败时把「哪个用例挂了、断言说了什么」写成 annotation：
          # 完整日志只有仓库管理员能下载，annotation 是公开可读的，排查不必先要权限。
          $trx = Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $trx) {
            Write-Host '::error::测试失败且没有产出 TRX，请查看完整日志'
            exit $code
          }

          [xml]$doc = Get-Content $trx.FullName -Raw
          $failed = @($doc.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' })

          if ($failed.Count -eq 0) {
            Write-Host '::error::测试失败但 TRX 里没有失败用例（可能是测试宿主崩溃）'
            exit $code
          }

          foreach ($item in $failed) {
            $message = ''
            try {
              $message = @($item.Output.ErrorInfo.Message -split "`r?`n" | Where-Object { $_.Trim() })[0]
            }
            catch {
              # 有些失败没有 ErrorInfo（例如断言外的异常），用例名本身已经够定位
            }

            Write-Host "::error title=失败用例::$($item.testName) | $message"
          }

          exit $code

      - name: 保留测试结果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 7

      - name: 发布单文件 exe（框架依赖）
        if: ${{ github.event.inputs.self_contained != 'true' }}
        # 注意：EnableCompressionInSingleFile 仅在 self-contained 下可用（NETSDK1176），
        # 因此这里用 --self-contained false 时必须去掉压缩项。
        run: >
          dotnet publish src/GHT/GHT.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o dist

      - name: 发布单文件 exe（独立部署，需手动触发）
        if: ${{ github.event.inputs.self_contained == 'true' }}
        run: >
          dotnet publish src/GHT/GHT.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o dist

      # 版本资源校验：确保发布出来的 exe 真的带着 csproj 里的版本号。
      # 这能挡住「改了 csproj 但产物是旧缓存」这类只在发布后才被发现的问题。
      - name: 校验产物与版本资源
        shell: pwsh
        run: |
          $exe = 'dist/GHT.exe'
          if (-not (Test-Path $exe)) {
            throw '发布产物中缺少 GHT.exe'
          }

          $version = ([xml](Get-Content 'src/GHT/GHT.csproj' -Raw)).Project.PropertyGroup.Version |
            Where-Object { $_ } | Select-Object -First 1

          $info = (Get-Item $exe).VersionInfo
          Write-Host "csproj Version = $version"
          Write-Host "exe FileVersion = $($info.FileVersion)"
          Write-Host "exe ProductVersion = $($info.ProductVersion)"

          if (-not $info.FileVersion.StartsWith($version)) {
            throw "产物 FileVersion=$($info.FileVersion) 与 csproj Version=$version 不一致"
          }

          Get-ChildItem dist | Format-Table Name, Length

      - name: 生成 SHA256 清单
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist/GHT.exe' -Algorithm SHA256).Hash
          "SHA256 (GHT.exe) = $hash" | Tee-Object -FilePath 'dist/SHA256SUMS.txt'

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: GHT-win-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
